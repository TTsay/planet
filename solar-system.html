<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>九大行星 3D 太陽系</title>
<style>
  :root {
    --night: #040814;
    --panel: rgba(8, 16, 38, 0.74);
    --rule: rgba(232, 226, 208, 0.12);
    --rule-strong: rgba(232, 226, 208, 0.24);
    --ink: #e8e2d0;
    --dim: #8e93a8;
    --faint: #5b6078;
    --sun: #f6c25b;
    --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  #scene { position: fixed; inset: 0; display: block; cursor: grab; touch-action: none; }
  #scene.dragging { cursor: grabbing; }

  /* ---------- 標題（直書） ---------- */
  .brand { position: fixed; top: 28px; left: 28px; display: flex; gap: 10px; pointer-events: none; }
  .brand h1 { writing-mode: vertical-rl; font-family: var(--serif); font-weight: 600; font-size: 30px; letter-spacing: 0.32em; line-height: 1; }
  .brand p { writing-mode: vertical-rl; font-size: 11.5px; color: var(--dim); letter-spacing: 0.18em; line-height: 1.2; padding-top: 4px; }

  /* ---------- 天體清單 ---------- */
  #list { position: fixed; top: 26px; left: 108px; display: flex; flex-direction: column; gap: 1px; }
  #list button { all: unset; display: grid; grid-template-columns: 18px 10px auto; align-items: center; column-gap: 10px; padding: 6px 14px 6px 8px; border-radius: 6px; cursor: pointer; color: var(--dim); font-size: 14px; letter-spacing: 0.08em; transition: background-color .2s, color .2s; }
  #list button:hover { color: var(--ink); background: rgba(232, 226, 208, 0.05); }
  #list button.active { color: var(--ink); background: rgba(232, 226, 208, 0.08); }
  #list button:focus-visible { outline: 1px solid var(--ink); }
  #list .idx { font-size: 11px; color: var(--faint); text-align: right; font-variant-numeric: tabular-nums; }
  #list .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  #list .dot.ring { background: transparent; border: 1px solid var(--dim); }
  #list .dw { margin-left: 8px; font-size: 10.5px; letter-spacing: 0.06em; color: var(--faint); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 0 4px; }
  #list .gap { height: 8px; }

  /* ---------- 天體標籤 ---------- */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; padding: 2px 4px 0; font-size: 12px; letter-spacing: 0.1em; color: var(--dim); white-space: nowrap; pointer-events: auto; cursor: pointer; user-select: none; text-shadow: 0 0 6px rgba(0,0,0,.9); }
  .label::after { content: ""; display: block; width: 1px; height: 7px; margin: 3px auto 0; background: currentColor; opacity: .45; }
  .label:hover, .label.active { color: var(--ink); }
  .label.hidden { display: none; }

  /* ---------- 資訊面板 ---------- */
  #info { position: fixed; top: 24px; right: 24px; width: 380px; max-height: calc(100vh - 128px); overflow-y: auto; display: grid; grid-template-columns: auto 1fr; column-gap: 20px; padding: 24px 24px 22px 20px; background: var(--panel); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--rule); border-radius: 10px; opacity: 0; transform: translateX(16px); pointer-events: none; transition: opacity .35s, transform .35s; }
  #info.open { opacity: 1; transform: none; pointer-events: auto; }
  #iName { writing-mode: vertical-rl; font-family: var(--serif); font-size: 44px; font-weight: 600; letter-spacing: 0.18em; line-height: 1; color: var(--ink); border-left: 2px solid var(--c, var(--ink)); padding-left: 12px; align-self: start; }
  .i-body { min-width: 0; }
  #iEn { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--dim); }
  #iClass { display: inline-block; margin-top: 8px; font-size: 11.5px; letter-spacing: 0.08em; color: var(--dim); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 1px 7px; }
  #iDesc { margin: 14px 0 16px; font-size: 13.5px; line-height: 1.85; color: #cfcab9; }
  #iData { display: grid; grid-template-columns: auto 1fr; border-top: 1px solid var(--rule); }
  #iData dt, #iData dd { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 12.5px; }
  #iData dt { color: var(--dim); padding-right: 14px; }
  #iData dd { text-align: right; font-variant-numeric: tabular-nums; }
  #iData dd small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  #iData dd.live { color: var(--c, var(--ink)); }
  #iNote { margin-top: 12px; font-size: 11.5px; line-height: 1.75; color: var(--dim); }
  #iNote:empty { display: none; }
  #closeInfo { all: unset; position: absolute; top: 12px; right: 14px; width: 26px; height: 26px; display: grid; place-items: center; cursor: pointer; color: var(--dim); font-size: 18px; border-radius: 4px; }
  #closeInfo:hover { color: var(--ink); background: rgba(232,226,208,.06); }

  /* ---------- 時間控制列 ---------- */
  #controls { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--rule); border-radius: 10px; font-size: 12.5px; white-space: nowrap; }
  .date { min-width: 150px; }
  .date .k { display: block; font-size: 10.5px; color: var(--dim); letter-spacing: 0.1em; }
  #date { font-size: 14px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  #date.warn { color: var(--sun); }
  .sep { width: 1px; height: 28px; background: var(--rule); }
  .ib { all: unset; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--rule-strong); cursor: pointer; }
  .ib:hover { background: rgba(232,226,208,.07); }
  .ib.on { border-color: var(--sun); color: var(--sun); }
  .ib:focus-visible, .tb:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .tb { all: unset; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--rule-strong); cursor: pointer; letter-spacing: 0.08em; }
  .tb:hover { background: rgba(232,226,208,.07); }
  .speed { display: flex; align-items: center; gap: 10px; }
  #speed { -webkit-appearance: none; appearance: none; width: 130px; height: 2px; background: var(--rule-strong); border-radius: 2px; outline: none; cursor: pointer; }
  #speed::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: none; }
  #speed::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: none; }
  #speed:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }
  #speedVal { min-width: 86px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .tog { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--dim); user-select: none; }
  .tog input { -webkit-appearance: none; appearance: none; width: 26px; height: 14px; border-radius: 999px; background: var(--rule-strong); position: relative; cursor: pointer; transition: background-color .2s; }
  .tog input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--dim); transition: transform .2s, background-color .2s; }
  .tog input:checked { background: rgba(232,226,208,.35); }
  .tog input:checked::after { transform: translateX(12px); background: var(--ink); }
  .tog:has(input:checked) { color: var(--ink); }

  /* ---------- 說明 ---------- */
  #meta { position: fixed; left: 28px; bottom: 24px; max-width: 250px; font-size: 11px; line-height: 1.7; color: var(--faint); pointer-events: none; }
  #meta b { font-weight: 500; color: var(--dim); }

  /* ---------- 載入畫面 ---------- */
  #loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); z-index: 10; transition: opacity .6s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .box { display: flex; flex-direction: column; align-items: center; gap: 18px; color: var(--dim); font-size: 13px; letter-spacing: 0.1em; }
  #loader .orb { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rule-strong); border-top-color: var(--sun); animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1320px) { #meta { bottom: 90px; } }
  @media (max-width: 1000px) { #meta { display: none; } }
  @media (max-width: 760px) {
    .brand { top: 14px; left: 14px; }
    .brand h1 { font-size: 22px; }
    .brand p { display: none; }
    #list { top: 12px; left: 56px; right: 8px; flex-direction: row; overflow-x: auto; scrollbar-width: none; }
    #list::-webkit-scrollbar { display: none; }
    #list button { grid-template-columns: 10px auto; padding: 6px 10px; }
    #list .idx, #list .gap { display: none; }
    #info { top: auto; bottom: 150px; left: 10px; right: 10px; width: auto; max-height: 42vh; }
    #iName { font-size: 32px; }
    #controls { left: 10px; right: 10px; bottom: 10px; transform: none; flex-wrap: wrap; justify-content: center; gap: 10px; white-space: normal; }
    .sep { display: none; }
    #speed { width: 110px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #info, #loader { transition: none; }
    #loader .orb { animation: none; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-label="可旋轉縮放的 3D 太陽系模型"></canvas>
<div id="labels"></div>

<header class="brand">
  <h1>九大行星</h1>
  <p>八大行星與矮行星冥王星</p>
</header>

<nav id="list" aria-label="選擇天體"></nav>

<aside id="info" aria-live="polite">
  <button id="closeInfo" aria-label="關閉資訊並回到全景">×</button>
  <h2 id="iName"></h2>
  <div class="i-body">
    <div id="iEn"></div>
    <div id="iClass"></div>
    <p id="iDesc"></p>
    <dl id="iData"></dl>
    <p id="iNote"></p>
  </div>
</aside>

<footer id="controls">
  <div class="date"><span class="k">模擬日期</span><span id="date">—</span></div>
  <div class="sep"></div>
  <button class="ib" id="btnRev" title="倒轉時間" aria-label="倒轉時間" aria-pressed="false">
    <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2 1 7l6 5zM13 2 7 7l6 5z" fill="currentColor"/></svg>
  </button>
  <button class="ib" id="btnPlay" title="暫停（空白鍵）" aria-label="暫停"></button>
  <button class="tb" id="btnToday">回到今天</button>
  <div class="speed">
    <input type="range" id="speed" min="0" max="100" value="60" aria-label="時間流速" />
    <span id="speedVal"></span>
  </div>
  <div class="sep"></div>
  <label class="tog"><input type="checkbox" id="tOrbit" checked /><span>軌道</span></label>
  <label class="tog"><input type="checkbox" id="tLabel" checked /><span>標籤</span></label>
  <label class="tog"><input type="checkbox" id="tBelt" checked /><span>小天體帶</span></label>
</footer>

<div id="meta">
  <b>操作</b>　拖曳旋轉、滾輪或雙指縮放，點選天體查看資料；鍵盤 1–9 選行星，0 回全景，空白鍵暫停。<br>
  <b>比例</b>　距離與大小皆經非線性壓縮，並非真實比例。行星位置依 JPL 近似軌道根數計算（1800–2050 年適用）。
</div>

<div id="loader"><div class="box"><div class="orb"></div><div id="loaderText">準備中</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const DEG = Math.PI / 180, TAU = Math.PI * 2;
const AU_KM = 149597870.7;
const J2000 = 2451545.0;
const OBLIQUITY = 23.43928 * DEG;

/* =====================================================================
   天體資料
   el：JPL「Approximate Positions of the Planets」J2000 平均軌道根數
       a 半長軸(AU)  e 離心率  I 軌道傾角(°)  L 平黃經(°)
       w 近日點經度 ϖ(°)  O 升交點經度 Ω(°)  Ld 平黃經變率(°/世紀)

         取反向是為了統一採「右手定則」正極，使金星、天王星的逆行自轉自然呈現
   ===================================================================== */
const PLANETS = [
  { key: 'mercury', name: '水星', en: 'Mercury', cls: '類地行星', color: '#b5aea4', D: 4879,
    el: { a: 0.38709927, e: 0.20563593, I: 7.00497902, L: 252.25032350, w: 77.45779628, O: 48.33076593, Ld: 149472.67411175 },
    rotH: 1407.6, tilt: 0.03, pole: [281.0103, 61.4155, false], moons: '0',

    rotH: 5832.6, tilt: 177.4, pole: [272.76, 67.16, true], moons: '0', atmo: ['#f6dca4', 0.9],
    desc: '濃厚的二氧化碳大氣造成失控溫室效應，表面約 465°C，是太陽系最熱的行星。自轉方向與公轉相反，自轉一圈（243 天）比公轉一圈（225 天）還久。' },
  { key: 'earth', name: '地球', en: 'Earth', cls: '類地行星', color: '#5b9ae0', D: 12756,
    el: { a: 1.00000261, e: 0.01671123, I: -0.00001531, L: 100.46457166, w: 102.93768193, O: 0.0, Ld: 35999.37244981 },
    rotH: 23.93, tilt: 23.44, pole: [0, 90, false], moons: '1', atmo: ['#6fb3ff', 1.2],
    desc: '目前已知唯一存在生命的天體，約 71% 的表面由液態水覆蓋。',
    note: '旁邊的灰色小球是月球，其大小與軌道距離同樣經過縮放。' },
  { key: 'mars', name: '火星', en: 'Mars', cls: '類地行星', color: '#d0703f', D: 6792,
    el: { a: 1.52371034, e: 0.09339410, I: 1.84969142, L: -4.55343205, w: -23.94362959, O: 49.55953891, Ld: 19140.30268499 },
    rotH: 24.62, tilt: 25.19, pole: [317.681, 52.887, false], moons: '2', atmo: ['#e89a6a', 0.35],
    desc: '表面富含氧化鐵而呈紅色，擁有太陽系最高的火山奧林帕斯山（高約 22 km）。兩顆小衛星為火衛一與火衛二。' },
  { key: 'jupiter', name: '木星', en: 'Jupiter', cls: '氣態巨行星', color: '#d8b58c', D: 142984,
    el: { a: 5.20288700, e: 0.04838624, I: 1.30439695, L: 34.39644051, w: 14.72847983, O: 100.47390909, Ld: 3034.74612775 },
    rotH: 9.93, tilt: 3.13, pole: [268.0566, 64.4953, false], moons: '115', atmo: ['#f0dcc0', 0.45],
    desc: '太陽系最大的行星，質量約為其他行星總和的 2.5 倍。大紅斑是比地球還大的反氣旋風暴，已被持續觀測超過 150 年。' },
  { key: 'saturn', name: '土星', en: 'Saturn', cls: '氣態巨行星', color: '#e6cf9c', D: 120536,
    el: { a: 9.53667594, e: 0.05386179, I: 2.48599187, L: 49.95424423, w: 92.59887831, O: 113.66242448, Ld: 1222.49362201 },
    rotH: 10.66, tilt: 26.73, pole: [40.589, 83.537, false], moons: '293', atmo: ['#f3e2b8', 0.4], ring: 'saturn',
    desc: '以壯觀的環系統著稱，環主要由冰粒與岩屑組成，厚度一般僅約 10 公尺至 1 公里。平均密度約 0.69 g/cm³，比水還低。' },
  { key: 'uranus', name: '天王星', en: 'Uranus', cls: '冰巨行星', color: '#a8dde4', D: 51118,
    el: { a: 19.18916464, e: 0.04725744, I: 0.77263783, L: 313.23810451, w: 170.95427630, O: 74.01692503, Ld: 428.48202785 },
    rotH: 17.24, tilt: 97.77, pole: [257.311, -15.175, true], moons: '29', atmo: ['#bff0f5', 0.8], ring: 'uranus',
    desc: '轉軸傾角約 98°，幾乎是「躺著」公轉；大氣中的甲烷吸收紅光而呈青綠色。1781 年由赫雪爾發現，是第一顆以望遠鏡發現的行星。' },
  { key: 'neptune', name: '海王星', en: 'Neptune', cls: '冰巨行星', color: '#4f7fe6', D: 49528,
    el: { a: 30.06992276, e: 0.00859048, I: 1.77004347, L: -55.12002969, w: 44.96476227, O: 131.78422574, Ld: 218.45945325 },
    rotH: 16.11, tilt: 28.32, pole: [299.36, 43.46, false], moons: '16', atmo: ['#6f9cff', 1.0],
    desc: '距太陽最遠的行星，1846 年依據天王星軌道擾動的數學預測而發現。擁有太陽系測得最強的風，風速可達約 2,000 km/h。' },

];
const SUN_INFO = {
  name: '太陽', en: 'The Sun', cls: '恆星（G2V 主序星）', color: '#f6c25b',
  desc: '太陽系的中心恆星，核心的氫核融合提供能量，質量約占整個太陽系的 99.86%。',
  rows: [
    ['直徑', '約 1,391,400 km<small>約為地球的 109 倍</small>'],
    ['光球層溫度', '約 5,772 K'],
    ['自轉週期', '約 25.4 天<small>赤道；兩極約 35 天</small>'],
    ['自轉軸傾角', '7.25°<small>相對黃道</small>'],
    ['年齡', '約 46 億年'],
  ],
  note: '畫面中的太陽已大幅縮小，否則會吞沒內側行星的軌道。',
};

/* =====================================================================
   程序化紋理：以 3D value noise 在球面取樣，避免經線接縫
   ===================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeNoise(seed) {
  const rnd = mulberry32(seed);
  const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const vals = new Float32Array(256);
  for (let i = 0; i < 256; i++) vals[i] = rnd();
  return (x, y, z) => {
    const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    const fx = x - X, fy = y - Y, fz = z - Z;
    const xi = X & 255, yi = Y & 255, zi = Z & 255;

    const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -p.vr * 1.7, 0), new THREE.Vector3(0, p.vr * 1.7, 0)]);
    p.axis = new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: p.color, transparent: true, opacity: 0.8 }));
    p.axis.visible = false; tiltG.add(p.axis);

    // 遠距離時仍可見的定位點與可點擊範圍
    p.marker = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3)),
      new THREE.PointsMaterial({ color: p.color, size: 5, sizeAttenuation: false, map: DOT(), transparent: true, alphaTest: 0.5, depthWrite: false }));
    p.anchor.add(p.marker);
    p.hit = new THREE.Mesh(new THREE.SphereGeometry(p.vr, 12, 8), new THREE.MeshBasicMaterial({ visible: false }));
    p.anchor.add(p.hit);
    hitMeshes.push({ mesh: p.hit, idx: i });

    // 軌道線
    const N = 512, arr = new Float32Array(N * 3), el = p.el;
    for (let k = 0; k < N; k++) {
      orbitPoint(el.a, el.e, el.I * DEG, el.O * DEG, (el.w - el.O) * DEG, k / N * TAU, tmp);
      toScene(tmp, v); arr[k * 3] = v.x; arr[k * 3 + 1] = v.y; arr[k * 3 + 2] = v.z;
    }
    const og = new THREE.BufferGeometry(); og.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    p.orbit = new THREE.LineLoop(og, new THREE.LineBasicMaterial({ color: 0xe8e2d0, transparent: true, opacity: 0.13, depthWrite: false }));
    scene.add(p.orbit); orbitLines.push(p.orbit);

    // 公轉週期（由平黃經變率換算，恆星週期）
    p.periodDays = 36525 * 360 / el.Ld;
    p.omegaCap = TAU * 0.2 * Math.sqrt(9.93 / p.rotH);
    addLabel(p.name, p.anchor, p.vr, i);
  });
}

/* =====================================================================
   相機控制（自製軌道式控制）
   ===================================================================== */
const OVERVIEW_R = 480;
const camS = { theta: 0.35, phi: 1.0, r: OVERVIEW_R }, camG = { ...camS };
const target = new THREE.Vector3(), focusFrom = new THREE.Vector3(), ORIGIN = new THREE.Vector3();
let focusIdx = -1, focusMode = 'overview', focusT = 1;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function minRadius() {
  if (focusIdx >= 0) return PLANETS[focusIdx].vr * 1.6;
  return focusMode === 'sun' ? SUN_R * 1.6 : 12;
}
const clampR = r => Math.min(1600, Math.max(minRadius(), r));
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function updateCamera(dt) {
  const goal = focusIdx >= 0 ? PLANETS[focusIdx].anchor.position : ORIGIN;
  if (focusT < 1) {
    focusT = reduceMotion ? 1 : Math.min(1, focusT + dt / 1.3);
    target.lerpVectors(focusFrom, goal, easeIO(focusT));
  } else target.copy(goal);
  const k = 1 - Math.exp(-dt * 8), kr = 1 - Math.exp(-dt * 4.5);
  camS.theta += (camG.theta - camS.theta) * k;
  camS.phi += (camG.phi - camS.phi) * k;
  camS.r += (camG.r - camS.r) * kr;
  const sp = Math.sin(camS.phi);
  camera.position.set(target.x + camS.r * sp * Math.sin(camS.theta), target.y + camS.r * Math.cos(camS.phi), target.z + camS.r * sp * Math.cos(camS.theta));
  camera.lookAt(target);
  camera.updateMatrixWorld();
}

const pointers = new Map();
let downX = 0, downY = 0, moved = false, pinchD = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { downX = e.clientX; downY = e.clientY; moved = false; }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); moved = true; }
});
canvas.addEventListener('pointermove', e => {
  const prev = pointers.get(e.pointerId); if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  prev.x = e.clientX; prev.y = e.clientY;
  if (pointers.size === 1) {
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 4) { moved = true; canvas.classList.add('dragging'); }
    camG.theta -= dx * 0.005;
    camG.phi = Math.min(Math.PI - 0.05, Math.max(0.05, camG.phi - dy * 0.005));
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0) camG.r = clampR(camG.r * pinchD / d);
    pinchD = d;
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  if (pointers.size === 1 && !moved && e.type === 'pointerup') pick(e.clientX, e.clientY);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchD = 0;
  if (pointers.size === 0) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); camG.r = clampR(camG.r * Math.exp(e.deltaY * 0.0012)); }, { passive: false });

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(hitMeshes.map(h => h.mesh), false);
  if (!hits.length) return;
  const h = hitMeshes.find(m => m.mesh === hits[0].object);
  if (h) focus(h.idx);
}

/* =====================================================================
   聚焦與資訊面板
   ===================================================================== */
const fmtInt = n => n.toLocaleString('zh-TW');
function fmtKm(km) { return km >= 1e8 ? `${(km / 1e8).toFixed(2)} 億 km` : `${fmtInt(Math.round(km / 1e4))} 萬 km`; }
function fmtPeriod(d) { return d < 1000 ? `${d.toFixed(2)} 天` : `${(d / 365.25).toFixed(2)} 年<small>${fmtInt(Math.round(d))} 天</small>`; }
function fmtRot(p) {
  const h = p.rotH, s = h >= 48 ? `${(h / 24).toFixed(2)} 天` : `${h.toFixed(2)} 小時`;
  return p.tilt > 90 ? `${s}<small>逆行自轉</small>` : s;
}

function showInfo(obj, rows) {
  const info = $('info');
  info.style.setProperty('--c', obj.color);
  $('iName').textContent = obj.name;
  $('iEn').textContent = obj.en;
  $('iClass').textContent = obj.cls;
  $('iDesc').textContent = obj.desc;
  $('iData').innerHTML = rows.map(([k, v, cls]) => `<dt>${k}</dt><dd${cls ? ` class="${cls}"` : ''}${cls === 'live' ? ' id="iLive"' : ''}>${v}</dd>`).join('');
  $('iNote').textContent = obj.note || '';
  info.classList.add('open');
  info.scrollTop = 0;
}
function planetRows(p) {
  const el = p.el;
  return [
    ['直徑', `${fmtInt(p.D)} km`],
    ['平均距日', `${el.a.toFixed(3)} AU<small>${fmtKm(el.a * AU_KM)}（半長軸）</small>`],
    ['目前距日', '—', 'live'],
    ['公轉週期', fmtPeriod(p.periodDays)],
    ['自轉週期', fmtRot(p)],
    ['轉軸傾角', `${p.tilt}°`],
    ['軌道離心率', el.e.toFixed(4)],
    ['軌道傾角', `${Math.abs(el.I).toFixed(2)}°<small>相對黃道</small>`],
    ['已知衛星', `${p.moons}${Number(p.moons) > 5 ? '<small>截至 2026 年中，仍持續增加</small>' : ''}`],
  ];
}

function focus(i) {
  focusFrom.copy(target); focusT = 0;
  if (i >= 0) {
    focusIdx = i; focusMode = 'planet';
    const p = PLANETS[i];
    camG.r = clampR(p.vr * (p.ring === 'saturn' ? 8.5 : 6));
    showInfo(p, planetRows(p));
  } else if (i === -2) {
    focusIdx = -1; focusMode = 'sun';
    camG.r = clampR(SUN_R * 6);
    showInfo(SUN_INFO, SUN_INFO.rows);
  } else {
    focusIdx = -1; focusMode = 'overview';
    camG.r = OVERVIEW_R;
    $('info').classList.remove('open');
  }
  PLANETS.forEach((p, k) => {
    const on = k === focusIdx;
    p.orbit.material.color.set(on ? p.color : 0xe8e2d0);
    p.orbit.material.opacity = on ? 0.75 : 0.13;
    p.axis.visible = on;
  });
  document.querySelectorAll('#list button').forEach(b => b.classList.toggle('active', Number(b.dataset.i) === i));
  labelItems.forEach(L => L.el.classList.toggle('active', L.idx === i));
  lastLive = 0;
}

function buildList() {
  const list = $('list');
  const items = [
    { i: -1, idx: '0', name: '全景', ring: true },
    { i: -2, idx: '', name: '太陽', c: '#f6c25b', gap: true },
    ...PLANETS.map((p, k) => ({ i: k, idx: String(k + 1), name: p.name, c: p.color, dw: p.dwarf })),
  ];
  items.forEach(it => {
    const b = document.createElement('button');
    b.dataset.i = it.i;
    b.innerHTML = `<span class="idx">${it.idx}</span><span class="dot${it.ring ? ' ring' : ''}" style="--c:${it.c || 'transparent'}"></span><span>${it.name}${it.dw ? '<span class="dw">矮行星</span>' : ''}</span>`;
    b.addEventListener('click', () => focus(it.i));
    list.appendChild(b);
    if (it.gap) { const g = document.createElement('div'); g.className = 'gap'; list.appendChild(g); }
  });
}

/* =====================================================================
   時間控制
   ===================================================================== */
let simJD = nowJD(), playing = true, dir = 1, daysPerSec = 10;
const PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 1.5v11l9-5.5z" fill="currentColor"/></svg>';
const PAUSE_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>';
function setPlaying(v) {
  playing = v;
  const b = $('btnPlay');
  b.innerHTML = v ? PAUSE_ICON : PLAY_ICON;
  b.setAttribute('aria-label', v ? '暫停' : '播放');
  b.title = v ? '暫停（空白鍵）' : '播放（空白鍵）';
}
function fmtSpeed(d) {
  if (d >= 365.25) return `${(d / 365.25).toFixed(d >= 3652.5 ? 0 : 1)} 年/秒`;
  return `${d < 0.1 ? d.toFixed(3) : d < 1 ? d.toFixed(2) : d < 10 ? d.toFixed(1) : Math.round(d)} 天/秒`;
}
function updSpeed() { daysPerSec = Math.pow(10, ($('speed').value - 40) / 20); $('speedVal').textContent = fmtSpeed(daysPerSec); }
function fmtDate(jd) {
  const d = new Date((jd - 2440587.5) * 864e5), y = d.getFullYear();
  return { text: `${y <= 0 ? '西元前 ' + (1 - y) : y} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`, out: y < 1800 || y > 2050 };
}

$('btnPlay').addEventListener('click', () => setPlaying(!playing));
$('btnRev').addEventListener('click', () => {
  dir = -dir;
  $('btnRev').classList.toggle('on', dir < 0);
  $('btnRev').setAttribute('aria-pressed', String(dir < 0));
});
$('btnToday').addEventListener('click', () => { simJD = nowJD(); });
$('speed').addEventListener('input', updSpeed);
$('tOrbit').addEventListener('change', e => orbitLines.forEach(l => l.visible = e.target.checked));
$('tBelt').addEventListener('change', e => { belt.visible = kuiper.visible = e.target.checked; });
$('closeInfo').addEventListener('click', () => focus(-1));
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'range' && e.key.startsWith('Arrow')) return;
  if (e.key >= '1' && e.key <= '9') focus(Number(e.key) - 1);
  else if (e.key === '0' || e.key === 'Escape') focus(-1);
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); setPlaying(!playing); }
});
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   主迴圈
   ===================================================================== */
const tmpA = { x: 0, y: 0, z: 0 }, pv = new THREE.Vector3(), wp = new THREE.Vector3();
let lastT = performance.now(), lastLive = 0, lastDate = 0, moonAngle = 0;
const BELT_W = TAU / (365.25 * Math.pow(2.7, 1.5)), KUIPER_W = TAU / (365.25 * Math.pow(42, 1.5));

function updateLabels(show) {
  const w = innerWidth, h = innerHeight, f = h / 2 / Math.tan(camera.fov * DEG / 2);
  for (const L of labelItems) {
    if (!show) { L.el.classList.add('hidden'); continue; }
    L.obj.getWorldPosition(pv);
    const dist = pv.distanceTo(camera.position);
    pv.project(camera);
    if (pv.z > 1 || pv.z < -1) { L.el.classList.add('hidden'); continue; }
    const x = (pv.x * 0.5 + 0.5) * w, y = (-pv.y * 0.5 + 0.5) * h - Math.max(L.r / dist * f, 3) - 4;
    L.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
    L.el.classList.remove('hidden');
  }
}

function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const rate = playing ? dir * daysPerSec : 0;
  simJD += rate * dt;
  const T = (simJD - J2000) / 36525;
  const f = innerHeight / 2 / Math.tan(camera.fov * DEG / 2);

  for (const p of PLANETS) {
    helio(p.el, T, tmpA);
    p.rAU = Math.hypot(tmpA.x, tmpA.y, tmpA.z);
    toScene(tmpA, p.anchor.position);
    // 自轉：模擬速度可呈現時用真實速率，過快時改以示意上限顯示
    const omega = Math.min(TAU * Math.abs(rate) * 24 / p.rotH, p.omegaCap) * Math.sign(rate);
    p.mesh.rotation.y += omega * dt;
    if (p.clouds) p.clouds.rotation.y += omega * 1.1 * dt;
    const dist = p.anchor.position.distanceTo(camera.position), pix = p.vr / dist * f;
    p.marker.visible = pix < 3;
    p.hit.scale.setScalar(Math.max(1, dist * 0.014 / p.vr));
  }
  moonAngle += Math.min(TAU * Math.abs(rate) / 27.321661, TAU * 0.5) * Math.sign(rate) * dt;
  moonPivot.rotation.y = moonAngle;
  sunSpin.rotation.y += Math.min(TAU * Math.abs(rate) / 25.38, TAU * 0.03) * Math.sign(rate) * dt;
  belt.rotation.y = ((simJD - J2000) * BELT_W) % TAU;
  kuiper.rotation.y = ((simJD - J2000) * KUIPER_W) % TAU;

  updateCamera(dt);
  stars.position.copy(camera.position);
  updateLabels($('tLabel').checked);

  if (now - lastDate > 100) {
    lastDate = now;
    const d = fmtDate(simJD), el = $('date');
    el.textContent = d.text;
    el.classList.toggle('warn', d.out);
    el.title = d.out ? '超出 JPL 近似軌道根數的適用年份（1800–2050），行星位置誤差會逐漸增大' : '';
  }
  if (focusIdx >= 0 && now - lastLive > 200) {
    lastLive = now;
    const live = $('iLive'), p = PLANETS[focusIdx];
    if (live) live.innerHTML = `${p.rAU.toFixed(3)} AU<small>${fmtKm(p.rAU * AU_KM)}</small>`;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* =====================================================================
   啟動：分段生成紋理，讓載入畫面能更新進度
   ===================================================================== */
async function init() {
  const jobs = [['sun', 512], ['mercury', 512], ['venus', 512], ['earth', 1024], ['clouds', 512], ['moon', 256],
    ['mars', 512], ['jupiter', 1024], ['saturn', 512], ['uranus', 256], ['neptune', 512], ['pluto', 512]];
  textures.dot = tex(dotCanvas());
  for (let k = 0; k < jobs.length; k++) {
    $('loaderText').textContent = `生成天體表面紋理 ${k + 1} / ${jobs.length}`;
    await new Promise(r => setTimeout(r, 16));
    const [key, w] = jobs[k];
    textures[key] = tex(paint(w, w / 2, PAINT[key]));
  }
  buildScene();
  buildList();
  if (reduceMotion) $('speed').value = 40;
  updSpeed();
  setPlaying(true);
  focus(-1);
  focusT = 1;
  $('loader').classList.add('done');
  requestAnimationFrame(t => { lastT = t; frame(t); });
}

if (typeof THREE === 'undefined') {
  $('loaderText').textContent = '無法載入 Three.js，請確認網路連線後重新整理頁面';
} else {
  init();
}
})();
</script>
</body>
</html>
